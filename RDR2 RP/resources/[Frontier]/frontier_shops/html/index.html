<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frontier shops</title><link rel="stylesheet" href="style.css"></head><body hidden><main>
<header><div><small>EXFIELD  /  FRONTIER MERCHANTS</small><h1 id="title">General store</h1><p id="kind"></p></div><div class="wallet"><span>Cash on hand</span><strong id="cash">$0.00</strong><small id="weight"></small></div><button id="close" class="quiet">Close ×</button></header>
<nav id="tabs"><button data-mode="buy">Buy goods</button><button data-mode="sell">Sell goods</button><button data-mode="receipts">Receipts</button></nav>
<div id="status" role="status"></div>
<div class="workspace"><section class="catalog"><div class="filters"><input id="search" type="search" placeholder="Search the catalogue…"><select id="category" aria-label="Category"></select></div><div id="products"></div></section><aside><h2 id="basketTitle">Your basket</h2><p class="muted" id="basketNote">Select goods from the catalogue.</p><div id="basket"></div><div class="total"><span>Total</span><strong id="total">$0.00</strong></div><button id="checkout" class="primary">Confirm purchase</button><button id="clear" class="quiet">Clear basket</button></aside></div>
<footer><button id="refresh" class="quiet">Refresh</button><span>Cash only · Items delivered to your satchel · Esc to close</span></footer></main><script src="app.js"></script></body></html>
