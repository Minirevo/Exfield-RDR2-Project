<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Frontier Inventar</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
</head>
<body hidden>
    <main aria-labelledby="title">
        <header><h1 id="title">Frontier Inventar</h1><button id="close" type="button">Schließen (Esc)</button></header>
        <div class="inventories">
            <section aria-labelledby="player-label">
                <h2 id="player-label">Tasche</h2>
                <p id="player-count"></p>
                <div id="player-slots" class="slots"></div>
            </section>
            <section id="storage" hidden aria-labelledby="storage-label">
                <h2 id="storage-label">Lager</h2>
                <p id="storage-count"></p>
                <div id="storage-slots" class="slots"></div>
            </section>
        </div>
        <section id="selection" hidden>
            <h2 id="item"></h2>
            <p id="description"></p>
            <div class="fields">
                <label>Menge <input id="quantity" type="number" min="1" value="1"></label>
                <label>Zielplatz <input id="target" type="number" min="1" max="200"></label>
                <label id="recipient-field">Empfänger <select id="recipient"></select></label>
            </div>
            <div id="actions" class="controls">
                <button type="button" data-action="move">Verschieben / Stapeln</button>
                <button type="button" data-action="split">Teilen</button>
                <button type="button" data-action="use">Benutzen</button>
                <button type="button" data-action="drop">Ablegen</button>
                <button type="button" data-action="give">Geben</button>
                <button type="button" data-action="store">Einlagern</button>
                <button type="button" data-action="retrieve">Entnehmen</button>
            </div>
        </section>
        <section id="ground" hidden><h2>Gegenstände am Boden</h2><div id="drops" class="controls"></div></section>
        <footer class="controls">
            <button id="sort" type="button">Tasche sortieren</button>
            <button id="refresh" type="button">Aktualisieren</button>
            <button id="retry" type="button" hidden>Denselben Auftrag wiederholen</button>
            <p id="message" role="status"></p>
        </footer>
    </main>
</body>
</html>
