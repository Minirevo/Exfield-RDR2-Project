<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:transparent;font:15px system-ui;color:#e8dcc3;pointer-events:none}aside{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);width:360px;background:#211e19ec;border:1px solid #c5a36b;border-radius:5px;padding:16px;text-align:center;box-shadow:0 8px 24px #0007}h2{font:normal 23px Georgia;margin:5px 0}small{color:#b3a58e}#bar{position:relative;background:#4b4134;height:22px;margin:12px 0}#target{position:absolute;background:#81945f;height:100%}#marker{position:absolute;width:3px;background:#fff3d6;height:100%}progress{width:100%;accent-color:#c5a36b}#hint{bottom:8vh;width:auto;padding:8px 16px}kbd{color:#c5a36b}</style></head><body><aside id="hint" hidden><kbd>E</kbd> <span id="hintText"></span><small id="river"></small></aside><aside id="work" hidden><small>FRONTIER · GATHERING</small><h2 id="title"></h2><div id="bar"><div id="target"></div><div id="marker"></div></div><p id="instruction"></p><progress id="time" max="1"></progress><small>Backspace to cancel</small></aside><script>'use strict';const $=id=>document.getElementById(id);let start=0,frame=0,hit=false;window.addEventListener('message',({data:d})=>{if(d.type==='hint'){$('hint').hidden=!d.label||!$('work').hidden;$('hintText').textContent=d.label||'';$('river').textContent=d.river?' · /gatherwater to change activity':''}else if(d.type==='work'){cancelAnimationFrame(frame);$('hint').hidden=true;$('work').hidden=false;$('title').textContent=d.label;$('bar').hidden=!d.qte;$('target').style.left=(d.target-d.width)*100+'%';$('target').style.width=d.width*200+'%';$('instruction').textContent=d.qte?'Press SPACE in the green zone':'Gathering';start=performance.now();hit=false;const tick=t=>{const e=t-start;$('time').value=Math.min(1,e/d.ms);if(!hit)$('marker').style.left=(e%1600)/16+'%';if(e<d.ms)frame=requestAnimationFrame(tick)};frame=requestAnimationFrame(tick)}else if(d.type==='strike'){hit=true;$('instruction').textContent='Strike recorded'}else if(d.type==='end'){cancelAnimationFrame(frame);$('work').hidden=true}})</script></body></html>
