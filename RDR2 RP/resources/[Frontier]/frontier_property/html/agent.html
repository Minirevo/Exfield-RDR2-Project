<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Grundbuchamt</title>
<link rel="stylesheet" href="agent.css"><script defer src="agent.js"></script><script defer src="planner.js"></script><script defer src="management.js"></script></head>
<body><aside id="hint" hidden><kbd>E</kbd> Grundbuchamt</aside><main hidden><header><div><h1>Grundbuchamt</h1><p id="town"></p></div><button id="close">Schließen <kbd>Esc</kbd></button></header>
<nav><button data-section="listings">Mietangebote</button><button data-section="sales">Verkäufe</button><button data-section="leases">Meine Mietobjekte</button><button data-section="plans">Baupläne</button><button data-section="owns">Mein Besitz</button><button data-section="recovery">Rückgabelager</button></nav>
<section id="content" aria-live="polite"></section><footer><button id="refresh">Aktualisieren</button><small id="notice" role="status"></small></footer></main>
<main id="planner" hidden>
<header><div><h1>Grundstück planen</h1><p>Relatives Raster um deinen Standort. Norden ist oben.</p></div><button id="planner-close">Abbrechen <kbd>Esc</kbd></button></header>
<label for="planner-zone">Kaufzone</label> <select id="planner-zone"></select>
<p>Klicken setzt einen Punkt. Vorhandene Punkte ziehen oder per Rechtsklick entfernen.</p>
<canvas id="planner-map" width="540" height="540" aria-label="Zeichenfläche für Grundstücksgrenzen"></canvas>
<footer><div><button id="planner-undo">Rückgängig</button> <button id="planner-quote">Fläche und Preis prüfen</button> <button id="planner-buy" disabled>Kauf bestätigen</button></div></footer>
<p id="planner-status" role="status"></p></main><main id="management" hidden><header><h1>Grundstück</h1><button id="manage-close">Schließen <kbd>Esc</kbd></button></header>
<section id="manage-list" aria-label="Immobilien"></section><section id="manage-details"></section>
<p id="manage-status" role="status"></p></main><aside id="walk-readout" hidden style="position:absolute;right:4vw;bottom:9vh;background:#292017;padding:12px"><canvas width="160" height="160"></canvas><p></p></aside></body></html>
