<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:transparent;color:#e8dcc3;font:14px system-ui}main{width:min(850px,90vw);max-height:86vh;overflow:auto;margin:7vh auto;background:#211e19;border:1px solid #c5a36b;padding:24px;box-shadow:0 18px 60px #0009}header{display:flex;justify-content:space-between;align-items:center}h1,h2{font-family:Georgia;font-weight:normal;margin:6px 0}small{color:#b3a58e}button{background:#403629;color:#e8dcc3;border:1px solid #726044;padding:9px;cursor:pointer}#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px}article{background:#302b23;border:1px solid #524634;padding:13px}progress{width:100%;accent-color:#a7b67b}strong{color:#c5a36b}</style></head><body hidden><main><header><div><small>FRONTIER · PROFESSION LEDGER</small><h1>Skills</h1></div><button id="close">Close · Esc</button></header><p>Learn by doing. All professions can reach level 100.</p><div id="list"></div></main><script>'use strict';const list=document.getElementById('list');function close(){fetch('https://'+GetParentResourceName()+'/close',{method:'POST',body:'{}'}).catch(()=>{})}document.getElementById('close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.body.hidden)close()});window.addEventListener('message',({data:d})=>{if(d.type==='close'){document.body.hidden=true;return}if(d.type!=='open')return;list.replaceChildren();for(const s of d.rows){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('progress'),r=document.createElement('strong'),x=document.createElement('p');h.textContent=s.name;r.textContent='Level '+s.level+' / 100';p.max=1;p.value=s.progress;x.textContent=s.xp+' XP';a.append(h,r,p,x);list.append(a)}document.body.hidden=false})</script></body></html>
